<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LitDigest</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2334567d'/%3E%3Cg fill='%23fff'%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5'/%3E%3Crect x='8' y='15' width='16' height='3' rx='1.5'/%3E%3Crect x='8' y='21' width='10' height='3' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<script defer src="/vendor/katex/katex.min.js"></script>
<script defer src="/vendor/katex/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#f6f5f2; --card:#fff; --ink:#191917; --muted:#6c6b64; --line:#e4e2dc;
  --accent:#34567d; --accent-soft:#e9eff6; --warn:#8a5a2b; --warn-soft:#f7eee2;
  --good:#2f6b4f; --bad:#8c3a3a;
  --on-accent:#fff;              /* text on a filled accent button */
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
  --lift:0 18px 60px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08);
  --ease:cubic-bezier(.22,.8,.26,1);
  --ui:Verdana,Geneva,"DejaVu Sans",sans-serif;
  --read:Verdana,Geneva,"DejaVu Sans",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141417; --card:#1d1d21; --ink:#e9e8e4; --muted:#9b9a93; --line:#2f2f36;
  --accent:#8db3dd; --accent-soft:#222c39; --warn:#d7aa6c; --warn-soft:#332b1f;
  --good:#7cc29b; --bad:#d98b8b;
  /* the dark theme's accent is a pale blue, so a filled button takes dark text */
  --on-accent:#14161c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --lift:0 18px 60px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
/* overflow:hidden alone throws the page back to the top, so the body is pinned
   at its current offset instead and put back afterwards. */
body.locked{position:fixed;left:0;right:0;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}

/* ---- top bar ---- */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:14px 20px 10px}
.bar-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:21px;letter-spacing:-.015em;margin-right:6px}
.brand small{color:var(--muted);font-weight:400;font-size:14.5px;margin-left:9px}
input[type=search]{flex:1;min-width:220px;padding:11px 14px;font-size:17px;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:9px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--card);border:1px solid var(--line);color:var(--ink);
  padding:10px 14px;font-size:16.5px;border-radius:9px}
.btn:hover{border-color:var(--accent)}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:9px}
.sortwrap{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px;white-space:nowrap}
.sortwrap select{font:inherit;font-size:15px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer}
.sortwrap select:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);
  padding:6px 13px;border-radius:999px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.count{color:var(--muted);font-size:15px}
.warnbar{margin-top:9px;padding:9px 13px;border-radius:9px;font-size:15px;
  background:var(--warn-soft);color:var(--warn);border:1px solid currentColor}

/* ---- grid ---- */
.grid{display:grid;gap:13px;padding:18px 20px 60px;
  grid-template-columns:repeat(auto-fill,minmax(385px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:15px 16px;cursor:pointer;display:flex;flex-direction:column;gap:7px;
  transition:border-color .12s, transform .12s, box-shadow .12s}
.card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
/* A note means you have been through this one. That is worth seeing from across
   the grid, so the whole card says it rather than a pill among the other pills.
   After :hover, so a read card keeps its colour while you point at it -- the lift
   and the shadow are affordance enough. Before .card.growing, so an opened card
   still takes the accent. */
.card.noted{border-color:var(--warn);border-width:2px}
.card h3{margin:0;font-family:var(--read);font-size:18px;line-height:1.38;
  font-weight:600;letter-spacing:-.012em}
.meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px}
.tag{padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px}
.tag.must{background:var(--warn-soft);color:var(--warn)}
.tag.read{background:var(--accent-soft);color:var(--good)}
.tag.discard{background:transparent;border:1px solid var(--line);color:var(--muted)}
.star{background:none;border:none;padding:0 2px;font-size:21px;line-height:1;
  color:var(--line);transition:color .12s, transform .12s}
.star:hover{transform:scale(1.15)}
.star[aria-pressed="true"]{color:#e8b53a}
.card h3{padding-right:4px}
.titlerow{display:flex;gap:8px;align-items:flex-start}
.card.growing .titlerow{padding-right:120px}
.card.growing .star{font-size:25px;margin-top:2px}
.titlerow h3{flex:1}
.notebox{width:100%;min-height:70px;resize:vertical;padding:10px 12px;
  border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);
  font:inherit;font-size:16.5px}
.notestate{color:var(--muted);font-size:14px;margin:6px 0 0;min-height:1.2em}
.dots{letter-spacing:2px;font-size:14px;color:var(--accent)}
.ghost{color:var(--muted);font-size:13.5px;font-style:italic}
/* what the brown border says, for anyone not reading the border */
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip-path:inset(50%);white-space:nowrap;border:0}

/* ---- the card growing into a sheet ---- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;
  transition:opacity .28s var(--ease);z-index:30;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.card.growing{position:fixed;z-index:40;margin:0;cursor:default;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:var(--lift);border-color:var(--accent);
  transition:top .34s var(--ease),left .34s var(--ease),
             width .34s var(--ease),height .34s var(--ease),
             padding .34s var(--ease),box-shadow .34s var(--ease)}
.card.growing:hover{transform:none}
.card.growing h3{font-size:30px;line-height:1.24;letter-spacing:-.018em;
  transition:font-size .34s var(--ease)}
.card.open{padding:26px 30px 30px}
.placeholder{border:1px dashed var(--line);border-radius:12px;opacity:.5}
.close{position:absolute;top:14px;right:16px;background:none;border:none;
  color:var(--muted);font-size:26px;line-height:1;padding:0 4px;z-index:2}
.close:hover{color:var(--ink)}
/* stepping through the list is the whole job, so the keys that do it are shown
   rather than left to be discovered */
.step{position:absolute;top:18px;right:52px;display:flex;gap:2px;z-index:2}
.step button{background:none;border:none;color:var(--muted);font-size:18px;
  line-height:1;padding:2px 6px;border-radius:6px}
.step button:hover:not(:disabled){color:var(--ink);background:var(--bg)}
.step button:disabled{opacity:.3;cursor:default}
.abs{border:1px solid var(--line);border-radius:9px;background:var(--bg);
  margin:14px 0 4px;padding:0 13px}
.abs summary{cursor:pointer;padding:10px 0;font-family:var(--ui);font-size:14px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700}
.abs summary::marker{color:var(--muted)}
.abs p{margin:0 0 13px;font-family:var(--read);font-size:16.5px;line-height:1.6}
.detail{opacity:0;transition:opacity .2s ease .12s;min-height:0}
.card.open .detail{overflow-y:auto;flex:1;padding-right:6px;padding-bottom:6px}
.card.open .detail{opacity:1}

/* ---- detail contents ---- */
section.blk{margin-bottom:18px}
section.blk h4{margin:0 0 9px;font-family:var(--ui);font-size:14px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent);font-weight:700;
  display:flex;align-items:center;gap:10px}
section.blk h4::after{content:"";flex:1;height:1px;background:var(--line)}
section.blk{margin-bottom:24px}
section.blk p{margin:0;white-space:pre-wrap;font-family:var(--read);font-size:18px;line-height:1.65}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
.rowbtns .btn[aria-pressed="true"]{background:var(--accent-soft);
  border-color:var(--accent);color:var(--accent)}
.eq{background:var(--bg);border:1px solid var(--line);border-radius:9px;
  padding:14px 10px;overflow-x:auto;text-align:center}
.points{margin:0;padding-left:22px}
.points li{margin-bottom:8px;font-family:var(--read);font-size:18px;line-height:1.6}
.points li:last-child{margin-bottom:0}
strong{font-weight:600;color:var(--ink)}
.points li strong,section.blk p strong{box-shadow:inset 0 -.42em 0 var(--accent-soft)}
.terms{margin:8px 0 0;padding-left:18px}
.terms li{margin-bottom:3px}
.figs{display:grid;gap:12px}
.figs.inline{margin:14px 0 4px}
.figs figure{margin:0}
/* capped on both sides so a tall plot cannot take the whole card; click one to
   see it at full size, since shrinking costs detail */
.figs img{display:block;margin:0 auto;width:auto;height:auto;
  max-width:min(100%,660px);max-height:400px;cursor:zoom-in;
  border:1px solid var(--line);border-radius:8px;background:#fff}
.figs figcaption{color:var(--muted);font-size:16px;line-height:1.5;margin-top:8px}
.terms li{font-family:var(--read)}
.brand{font-family:var(--ui);font-weight:600}
.qa{border-top:1px solid var(--line);margin-top:22px;padding-top:16px}
.qa h4{margin:0 0 10px;font-family:var(--ui);font-size:14px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent);font-weight:700}
.qa .turn{margin-bottom:14px}
.qa .q{font-weight:600;margin:0 0 4px}
.qa .a{margin:0;white-space:pre-wrap;font-family:var(--read);font-size:17.5px;line-height:1.62}
/* lifted onto the score line, which is short and sits on the left, so the
   header does not grow a band of empty space for two small buttons */
.card.growing .controls{flex:0 0 auto;margin:-32px 0 6px}
.card.growing .controls .rowbtns{margin:0;gap:7px;justify-content:flex-end}
/* header controls, not calls to action: small enough to sit under the title */
.card.growing .controls .btn{font-size:13.5px;padding:6px 12px;border-radius:7px}
.askbar{flex:0 0 auto;border-top:1px solid var(--line);padding-top:13px;margin-top:12px;
  background:var(--card)}
.askrow{display:flex;gap:8px}
.askrow input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink)}

/* ---- progress ---- */
.job{margin:2px 0 4px}
.jobtrack{height:4px;background:var(--line);border-radius:3px;overflow:hidden}
.jobfill{height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .4s linear}
.jobtext{color:var(--muted);font-size:13px;margin-top:5px;font-variant-numeric:tabular-nums}
.prog{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg)}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:15px;margin-bottom:9px}
.prog-top b{font-weight:600}
.prog-top span{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.track{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .4s linear}
.think{margin:9px 0 0;color:var(--muted);font-size:14px;line-height:1.45;
  max-height:3.6em;overflow:hidden;font-style:italic}
.spin::after{content:"";display:inline-block;width:9px;height:9px;margin-left:6px;
  border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;
  animation:spin .7s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--bad);font-size:15px}

@media (prefers-reduced-motion:reduce){
  .card.growing{transition:none}
  .scrim{transition:none}
  .detail{transition:none}
}
@media (max-width:620px){
  .grid{padding:14px 16px 60px}
  .bar{padding:12px 16px 8px}
  .card.open{padding:20px 18px 28px}
  .card.growing .controls{margin:8px 0 4px}
  .card.growing h3{font-size:24px}
  .card.growing .titlerow{padding-right:106px}
}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-row">
    <span class="brand">LitDigest<small id="src"></small></span>
    <input type="search" id="q" placeholder="Search title, author, note…" autocomplete="off">
    <button class="btn" id="reload" title="Re-read the spreadsheet">Reload sheet</button>
    <button class="btn" id="quit" title="Stop the LitDigest server">Quit</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="meta-row">
    <div class="count" id="count"></div>
    <label class="sortwrap">Sort
      <select id="sort" title="How to order the cards">
        <option value="sheet">Spreadsheet order</option>
        <option value="sheetrev">Spreadsheet order, reversed</option>
        <option value="score">Best first</option>
        <option value="starred">Starred first</option>
        <option value="unread">Unread first</option>
        <option value="year">Newest first</option>
        <option value="title">Title A–Z</option>
      </select>
    </label>
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="scrim" id="scrim"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PAPERS = [], topic = null, starsOnly = false, open = null;
let VIEW = [];              // what the grid is showing, in its own order

const SORTS = {
  sheet:    (a, b) => a.num - b.num,
  sheetrev: (a, b) => b.num - a.num,
  score:   (a, b) => (b.score || 0) - (a.score || 0) || a.num - b.num,
  starred: (a, b) => (b.starred ? 1 : 0) - (a.starred ? 1 : 0) || a.num - b.num,
  unread:  (a, b) => (a.has_glance ? 1 : 0) - (b.has_glance ? 1 : 0) || a.num - b.num,
  year:    (a, b) => String(b.year || '').localeCompare(String(a.year || '')) || a.num - b.num,
  title:   (a, b) => a.title.localeCompare(b.title),
};
let sortBy = 'sheet';
try{ sortBy = localStorage.getItem('litdigest.sort') || 'sheet'; }catch(e){}
if(!SORTS[sortBy]) sortBy = 'sheet';

/* ---------- streaming ---------- */
async function stream(url, body, h){
  const res = await fetch(url, {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : null});
  if(!res.ok){ h.done({error:'HTTP ' + res.status + ' ' + (await res.text()).slice(0,200)}); return; }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  while(true){
    const {value, done} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    const parts = buf.split('\n\n'); buf = parts.pop();
    for(const p of parts){
      if(!p.startsWith('data: ')) continue;
      const msg = JSON.parse(p.slice(6));
      if(msg.phase && h.phase) h.phase(msg);
      if(msg.think && h.think) h.think(msg.think);
      if(msg.t) h.text(msg.t);
      if(msg.done || msg.error) h.done(msg);
    }
  }
}

function sections(raw){
  const out = {}, re = /^\[([A-Z][A-Z ]+)\]\s*$/gm;
  const marks = [...raw.matchAll(re)];
  marks.forEach((m, i) => {
    const key = m[1].trim().toLowerCase().replace(/ /g,'_');
    out[key] = raw.slice(m.index + m[0].length,
                         i+1 < marks.length ? marks[i+1].index : raw.length).trim();
  });
  return out;
}
const dots = n => '●'.repeat(n) + '○'.repeat(5-n);

/* ---------- generations still running ----------
   The fetch keeps streaming after its card is closed, and the server saves the
   result either way, so a job is tracked by paper number and drawn on the grid
   card until it finishes.

   A job owns the text so far and how to draw it, but not the panel it draws into:
   that belongs to the card, which can be closed and built again underneath it.
   jobShow hands a running job the panel a freshly opened card just made, so
   reopening a paper picks its generation back up instead of starting a second
   one and paying for the same reading twice. */
const JOBS = new Map();
let ticker = null;

function paint(){
  for(const [num, j] of JOBS){
    const card = document.querySelector(`.card[data-num="${num}"]`);
    if(!card) continue;
    const secs = (Date.now() - j.t0) / 1000;
    const fill = card.querySelector('.jobfill');
    const text = card.querySelector('.jobtext');
    if(fill) fill.style.width = (Math.min(secs / j.expected, 0.95) * 100).toFixed(1) + '%';
    if(text) text.textContent = `${j.label} · ${Math.round(secs)}s`;
  }
}

function jobStart(num, kind, root, render){
  const j = {kind, render, raw: '', t0: Date.now(), label: 'starting',
             expected: kind === 'deep' ? 300 : 180,
             root: null, box: null, pr: null};
  JOBS.set(num, j);
  jobShow(num, root);
  if(!ticker) ticker = setInterval(() => {
    if(!JOBS.size){ clearInterval(ticker); ticker = null; return; }
    paint();
  }, 500);
  return j;
}

/* Point a running job at the panel of the card that is open now. Which panel it
   is follows from what is being generated, so a deep read reopened mid-flight
   lands under the glance rather than on top of it. */
function jobShow(num, root){
  const j = JOBS.get(num);
  if(!j || !root) return null;
  const box = root.querySelector(j.kind === 'deep' ? '.deepwrap' : '.glance');
  if(!box) return null;
  j.root = root;
  j.box = box;
  j.pr = progress(box, j.label, j.t0, j.expected);
  if(j.raw){ j.pr.writing(); box.innerHTML = j.render(j.raw); }
  return j;
}

/* The open card is going away. The streams keep running -- only the panels they
   were drawing into are about to be removed. */
function jobDetach(){
  for(const j of JOBS.values()){
    if(j.pr) j.pr.stop();
    j.pr = null; j.box = null; j.root = null;
  }
}

const jobPhase = (j, m) => {
  j.label = m.phase;
  if(m.expected) j.expected = m.expected;
  if(j.pr) j.pr.phase(m);
};

const jobText = (j, t) => {
  if(!j.raw){ j.label = 'writing it up'; if(j.pr) j.pr.writing(); }
  j.raw += t;
  if(j.box) j.box.innerHTML = j.render(j.raw);
};

async function jobEnd(num){
  const j = JOBS.get(num);
  if(j && j.pr) j.pr.stop();
  JOBS.delete(num);
  try{
    const d = await (await fetch(`/api/papers/${num}`)).json();
    const p = PAPERS.find(x => x.num === num);
    if(p && d.card) Object.assign(p, d.card);
  }catch(e){ /* the card keeps what it had */ }
  render();
}

/* ---------- progress ---------- */
function progress(box, label, t0, estimate){
  box.innerHTML = `<div class="prog">
    <div class="prog-top"><b class="pl">${label}</b><span class="pt"></span></div>
    <div class="track"><div class="fill pf"></div></div>
    <p class="think pk"></p></div>`;
  t0 = t0 || Date.now();
  let expected = estimate || 60, thought = '', stopped = false;
  const tick = () => {
    if(stopped) return;
    const el = (Date.now()-t0)/1000, pf = box.querySelector('.pf');
    if(!pf) return;
    pf.style.width = (Math.min(el/expected,.95)*100).toFixed(1) + '%';
    box.querySelector('.pt').textContent = `${el.toFixed(0)}s of about ${Math.round(expected)}s`;
  };
  const timer = setInterval(tick, 500); tick();
  const set = (sel, txt) => { const e = box.querySelector(sel); if(e) e.textContent = txt; };
  return {
    phase(m){ if(m.expected) expected = m.expected; set('.pl', m.phase); },
    think(t){ thought = (thought + t).slice(-400);
              set('.pk', thought.replace(/\s+/g,' ').trim()); },
    writing(){ set('.pl','writing it up'); set('.pk',''); },
    stop(){ stopped = true; clearInterval(timer); }
  };
}

/* ---------- grid ---------- */
function starBtn(p){
  return `<button class="star" data-star="${p.num}" aria-pressed="${p.starred}"
    title="${p.starred ? 'Starred — highlighted yellow in the spreadsheet'
                       : 'Star this paper (highlights it yellow in the spreadsheet)'}"
    >${p.starred ? '★' : '☆'}</button>`;
}

function cardHtml(p){
  return `<article class="card${p.notes ? ' noted' : ''}" data-num="${p.num}">
    <div class="titlerow"><h3>${esc(p.title)}</h3>${starBtn(p)}</div>
    <div class="meta">
      <span class="tag">${esc(p.topic)}</span>
      ${p.notes ? '<span class="sr">read — you have a note on this</span>' : ''}
      <span>${esc(p.authors)}</span><span>${esc(p.year)}</span>
      ${p.match==='none' ? '<span class="tag discard">not on arXiv</span>' : ''}
    </div>
    ${p.score ? `<div class="dots">${dots(p.score)}</div>` : ''}
    ${JOBS.has(p.num) ? `<div class="job"><div class="jobtrack"><div class="jobfill"></div></div>
       <div class="jobtext">working</div></div>` : ''}
    ${p.has_glance ? '' : `<p class="ghost">${p.match==='none' ? 'no source to read' : 'click to read it for you'}</p>`}
  </article>`;
}

function render(){
  if(open !== null) return;           // never redraw the grid under an open card
  const needle = $('#q').value.trim().toLowerCase();
  const hits = PAPERS.filter(p =>
    (!topic || p.topic === topic) &&
    (!starsOnly || p.starred) &&
    (!needle || needle.split(/\s+/).every(w =>
      (p.title+' '+p.authors+' '+p.topic+' '+p.notes).toLowerCase().includes(w))));
  hits.sort(SORTS[sortBy] || SORTS.sheet);
  VIEW = hits;
  $('#grid').innerHTML = hits.map(cardHtml).join('');
  $('#count').textContent =
    `${hits.length} of ${PAPERS.length} papers · ${PAPERS.filter(p=>p.has_glance).length} read so far`;
  renderMath($('#grid'));
  paint();
}

function buildChips(){
  const box = $('#chips'); box.innerHTML = '';
  const add = (label, on, fn) => {
    const b = document.createElement('button');
    b.className='chip'; b.type='button'; b.textContent=label;
    b.setAttribute('aria-pressed', on ? 'true':'false');
    b.onclick = () => { fn(); buildChips(); render(); };
    box.appendChild(b);
  };
  [...new Set(PAPERS.map(p=>p.topic))].sort().forEach(t =>
    add(`${t} (${PAPERS.filter(p=>p.topic===t).length})`, topic===t,
        () => topic = topic===t ? null : t));
  const starred = PAPERS.filter(p=>p.starred).length;
  if(starred) add(`★ starred (${starred})`, starsOnly, () => starsOnly = !starsOnly);
}

/* ---------- background scroll lock ---------- */
let lockedY = 0;
function lockScroll(){
  lockedY = window.scrollY;
  document.body.style.top = `-${lockedY}px`;
  document.body.classList.add('locked');
}
function unlockScroll(){
  if(!document.body.classList.contains('locked')) return;
  document.body.classList.remove('locked');
  document.body.style.top = '';
  window.scrollTo(0, lockedY);
}

/* ---------- the expand animation ---------- */
/* transitionend does not fire if a property happens not to change, so the
   follow-up work is also armed on a timer and runs whichever comes first. */
function after(el, fn){
  let done = false;
  const go = () => { if(done) return; done = true;
                     el.removeEventListener('transitionend', onEnd); fn(); };
  const onEnd = e => { if(e.target === el && e.propertyName === 'height') go(); };
  el.addEventListener('transitionend', onEnd);
  setTimeout(go, 420);
}

function targetRect(){
  const w = Math.min(1240, innerWidth - 40);
  const h = Math.min(innerHeight - 56, 900);
  return {left:(innerWidth - w)/2, top:(innerHeight - h)/2, width:w, height:h};
}

function expand(card){
  const r = card.getBoundingClientRect();
  const ph = document.createElement('div');
  ph.className = 'placeholder';
  ph.style.height = r.height + 'px';
  card.parentNode.insertBefore(ph, card);
  card._ph = ph;

  Object.assign(card.style, {top:r.top+'px', left:r.left+'px',
                             width:r.width+'px', height:r.height+'px'});
  card.classList.add('growing');
  card.offsetHeight;                                   // commit the start frame
  const t = targetRect();
  Object.assign(card.style, {top:t.top+'px', left:t.left+'px',
                             width:t.width+'px', height:t.height+'px'});
  const opened = () => card.classList.add('open');
  after(card, opened);
}

function collapse(then){
  const card = document.querySelector('.card.growing');
  if(!card) return;
  const num = open; open = null;
  // Chrome fires blur when the focused textarea is removed, so a note being typed
  // when Escape is pressed does get saved there. WebKit has long been unreliable
  // about that, and this opens in whatever the default browser is, so the note is
  // flushed explicitly while it is still in the document. saveNote is idempotent,
  // so the blur that follows costs nothing.
  const note = card.querySelector('.notebox');
  if(note && note._save) note._save();
  jobDetach();                               // the streams live on; their panels do not
  unlockScroll();                            // before measuring, so the rect is right
  const ph = card._ph;
  const r = ph ? ph.getBoundingClientRect() : card.getBoundingClientRect();
  card.classList.remove('open');
  card.scrollTop = 0;
  card.querySelectorAll('.detail, .askbar, .controls, .step').forEach(el => el.remove());
  const close = card.querySelector('.close');
  if(close) close.remove();
  Object.assign(card.style, {top:r.top+'px', left:r.left+'px',
                             width:r.width+'px', height:r.height+'px'});
  $('#scrim').classList.remove('on');
  after(card, () => {
    card.classList.remove('growing');
    card.removeAttribute('style');
    if(ph) ph.remove();
    render();
    if(then) then();
  });
}

/* Walk the grid without going back to it. The next paper is picked before the
   card collapses, because finishing a reading can reorder the grid underneath --
   "unread first" moves the very paper you just read out from under the arrow. */
function step(delta){
  if(open === null) return;
  const i = VIEW.findIndex(p => p.num === open);
  const next = i < 0 ? null : VIEW[i + delta];
  if(!next) return;
  collapse(() => {
    document.querySelector(`.card[data-num="${next.num}"]`)
            ?.scrollIntoView({block: 'center'});
    openCard(next.num);
  });
}

function openCard(num){
  if(open !== null) return;
  const card = document.querySelector(`.card[data-num="${num}"]`);
  if(!card) return;
  open = num;
  lockScroll();                              // the page behind must not scroll
  $('#scrim').classList.add('on');

  const close = document.createElement('button');
  close.className = 'close'; close.setAttribute('aria-label','Close');
  close.textContent = '×';
  close.onclick = e => { e.stopPropagation(); collapse(); };
  card.appendChild(close);

  const at = VIEW.findIndex(p => p.num === num);
  const steps = document.createElement('div');
  steps.className = 'step';
  steps.innerHTML = `
    <button data-step="-1" aria-label="Previous paper" title="Previous paper (\u2190)"
      ${at <= 0 ? 'disabled' : ''}>\u2039</button>
    <button data-step="1" aria-label="Next paper" title="Next paper (\u2192)"
      ${at < 0 || at >= VIEW.length - 1 ? 'disabled' : ''}>\u203a</button>`;
  steps.onclick = e => {
    const b = e.target.closest('[data-step]');
    if(!b || b.disabled) return;
    e.stopPropagation();
    step(+b.dataset.step);
  };
  card.appendChild(steps);

  const controls = document.createElement('div');
  controls.className = 'controls';
  card.appendChild(controls);

  const detail = document.createElement('div');
  detail.className = 'detail';
  card.appendChild(detail);

  // sits below the scrolling area, so a question can be typed at any point
  const askbar = document.createElement('div');
  askbar.className = 'askbar';
  card.appendChild(askbar);

  expand(card);
  fillDetail(num, detail);
}

/* ---------- detail ---------- */
/* The model puts each sentence on its own line out of habit, and pre-wrap would
   show every one of those as a break. These sections are paragraphs, so any
   newline inside one is an artifact. */
const prose = t => String(t || '').replace(/\s*\n+\s*/g, ' ').trim();

/* Sections are bullets. Digests written before that was asked for are single
   paragraphs, so they are split at sentence ends -- taking care not to break on
   "Fig. 7" or a decimal, and gluing back any fragment too short to stand alone. */
const ABBREV = /\b(?:Fig|Figs|Eq|Eqs|Sec|Secs|No|St|cf|vs|al|approx|Prop|Thm|Lem|Ref|Refs|Ch|pp)\.$/;

function bullets(text){
  const lines = String(text || '').split('\n').map(l => l.trim()).filter(Boolean);
  if(lines.length && lines.every(l => /^[-*\u2022]\s/.test(l)))
    return lines.map(l => l.replace(/^[-*\u2022]\s*/, ''));

  const flat = prose(text);
  if(!flat) return [];
  const out = [];
  for(const part of flat.split(/(?<=[.!?])\s+(?=[A-Z(\\])/)){
    const last = out[out.length - 1];
    if(last && (ABBREV.test(last) || last.length < 30)) out[out.length - 1] = last + ' ' + part;
    else out.push(part);
  }
  return out;
}

const points = text => {
  const xs = bullets(text);
  return xs.length ? `<ul class="points">${xs.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`
                   : '';
};

// [KEY POINTS] was [TRICK] in summaries written before it was renamed
function glanceHtml(s){
  return `
  <section class="blk"><h4>Key points</h4>${points(s.key_points || s.trick)}</section>`;
}
const figNum = f => {
  const m = String(f.caption || '').match(/fig(?:ure)?\.?\s*(\d+)/i);
  return m ? +m[1] : null;
};

/* "Figure 8", "Figs. 7-8", "fig 3" -- the numbers a passage sends you to. */
function figureRefs(text){
  const out = new Set();
  for(const m of String(text || '').matchAll(/fig(?:ure)?s?\.?\s*(\d+)\s*(?:[-\u2013\u2014]\s*(\d+))?/gi)){
    const a = +m[1], b = m[2] ? +m[2] : a;
    for(let n = a; n <= b && n - a < 8; n++) out.add(n);
  }
  return out;
}

const figureMarkup = f =>
  `<figure><a href="/fig/${encodeURIComponent(f.file)}" target="_blank" rel="noopener"
       title="Open at full size"><img loading="lazy"
       src="/fig/${encodeURIComponent(f.file)}" alt=""></a>
     <figcaption>${esc(f.caption)}</figcaption></figure>`;

/* Any figure this passage names, shown right under it rather than saved up for
   the end, so the argument and its picture stay together. */
function figuresFor(text, data, used){
  if(!data || !data.figures || !data.figures.length) return '';
  const want = figureRefs(text);
  const picked = data.figures.filter(f => {
    const n = figNum(f);
    return n && want.has(n) && !used.has(f.file);
  });
  picked.forEach(f => used.add(f.file));
  return picked.length ? `<div class="figs inline">${picked.map(figureMarkup).join('')}</div>` : '';
}

function deepHtml(s, data, used){
  // each line is "symbol -- meaning"; the symbol is LaTeX whether or not the
  // model remembered to delimit it
  const terms = (s.terms||'').split('\n').filter(Boolean).map(t => {
    const line = t.replace(/^[-*]\s*/, '').trim();
    const m = line.match(/^(.+?)\s+--+\s+(.*)$/);
    if(!m) return `<li>${esc(line)}</li>`;
    const sym = (/[\\^_{}]/.test(m[1]) && !m[1].includes('\\(')) ? `\\(${m[1]}\\)` : m[1];
    return `<li>${esc(sym)} — ${esc(m[2])}</li>`;
  }).join('');
  const seen = used || new Set();
  const fig = t => figuresFor(t, data, seen);
  return `
  <section class="blk"><h4>What you already know</h4>${points(s.setup)}${fig(s.setup)}</section>
  <section class="blk"><h4>Mechanism</h4>${points(s.mechanism)}${fig(s.mechanism)}</section>
  ${s.equation ? `<section class="blk"><h4>Central equation</h4>
     <div class="eq"></div>${terms ? `<ul class="terms">${terms}</ul>`:''}</section>` : ''}
  <section class="blk"><h4>Limits</h4>${points(s.limits)}${fig(s.limits)}</section>
  <section class="blk"><h4>How you'd use it</h4>${points(s.use)}${fig(s.use)}</section>`;
}
/* Maths inside prose. The model is asked for $...$, but digests written before
   that instruction have bare fragments like C(|h|+x)^{3/2}, so a token carrying
   an exponent or subscript is wrapped before handing the block to KaTeX. */
const BARE_MATH = /(?:[A-Za-z0-9)\]|]|\\[A-Za-z]+)(?:\^|_)(?:\{[^}]{1,24}\}|[A-Za-z0-9])/;

/* Digests written earlier delimited maths with $...$, which collides with money
   ("transferring about $8.2 million and $3.1 million" would typeset the words
   between). A pair is only treated as maths when it contains something no price
   ever does. */
function legacyDollars(text){
  let out = '', i = 0;
  for(;;){
    const a = text.indexOf('$', i);
    const b = a < 0 ? -1 : text.indexOf('$', a + 1);
    if(a < 0 || b < 0){ out += text.slice(i); return out; }
    const inner = text.slice(a + 1, b);
    // Maths has no spaces in it ("$L$", "$x^2$", "$\\partial_t u$" once braced);
    // a price always runs on into words ("$8.2 million and ").
    const looksMaths = /[\\^_{}]/.test(inner) || (inner.length <= 16 && !/\s/.test(inner));
    if(inner.length <= 200 && !inner.includes('\n') && looksMaths){
      out += text.slice(i, a) + '\\(' + inner + '\\)';
      i = b + 1;
    }else{
      out += text.slice(i, a + 1);      // a price: keep it, retry from the next $
      i = a + 1;
    }
  }
}

function wrapBareMath(text){
  if(text.includes('\\(')) return text;            // already delimited, leave alone
  const count = (s, c) => (s.split(c).length - 1);
  return text.split(/(\s+)/).map(tok => {
    if(!BARE_MATH.test(tok)) return tok;
    let core = tok, post = '';
    while(core.length > 1){                        // peel only what is not maths
      const last = core[core.length - 1];
      const unopened = last === ')' && count(core, ')') > count(core, '(');
      if('.,;:'.includes(last) || unopened){ post = last + post; core = core.slice(0, -1); }
      else break;
    }
    return `\\(${core}\\)${post}`;
  }).join('');
}

/* What the eye should land on: whatever the model marked with **asterisks**, plus
   the numbers that settle a result -- a multiplier, a percentage, a fine decimal.
   Plain integers are left alone, since "Section 4" and "2026" are not findings,
   and neither is a grid size, so a x followed by another number does not count. */
const QUANTITY = /\b\d[\d,]*(?:\.\d+)?\s?[×x](?!\s*\d)|\b\d[\d,]*(?:\.\d+)?\s?%|\b\d*\.\d{3,}\b/g;

/* What the model marked, turned into real emphasis -- and done before KaTeX, not
   after it. KaTeX replaces each formula with a span of its own, which breaks the
   line into pieces: "out to **\(t = 0.3\)**." ends up as the text "out to **",
   a rendered element, and the text "**.", and neither piece holds a complete pair
   any more. Marking first leaves KaTeX free to typeset inside the emphasis. */
function boldMarks(root){
  root.querySelectorAll('section.blk p, .points li, .qa .a').forEach(el => {
    if(el.dataset.marked || !el.textContent.includes('**')) return;
    el.dataset.marked = '1';
    el.innerHTML = esc(el.textContent)
      .replace(/\*\*([^*]{1,60})\*\*/g, '<strong>$1</strong>');
  });
}

/* The numbers that settle a result, for the lines the model left unmarked. Runs
   after the maths, so it only ever touches what is left as plain text. */
function emphasise(el){
  if(el.querySelector('strong')) return;          // the model already said what matters
  const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement && !n.parentElement.closest('.katex, strong, .eq')
      ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
  });
  const nodes = [];
  while(walk.nextNode()) nodes.push(walk.currentNode);
  for(const n of nodes){
    if(!/\d/.test(n.nodeValue)) continue;
    const plain = esc(n.nodeValue);
    const html = plain.replace(QUANTITY, m => `<strong>${m}</strong>`);
    if(html === plain) continue;
    const span = document.createElement('span');
    span.innerHTML = html;
    n.parentNode.replaceChild(span, n);
  }
}

/* The maths and the emphasis are separate passes, and only the first one needs
   KaTeX. Bailing out of both when the library is missing is how a page served by a
   server too old to have /vendor ends up showing raw \(x\) *and* raw **asterisks**. */
function renderMath(root, macros){
  if(window.renderMathInElement){
    root.querySelectorAll('section.blk p, .points li, .qa .a, .terms li').forEach(el => {
      if(el.dataset.mathed) return;
      const t = legacyDollars(el.textContent);
      el.textContent = BARE_MATH.test(t) ? wrapBareMath(t) : t;
      el.dataset.mathed = '1';
    });
  }
  boldMarks(root);                      // before the typesetting, see above
  if(window.renderMathInElement){
    try{
      renderMathInElement(root, {
        delimiters:[{left:'\\[',right:'\\]',display:true},
                    {left:'$$',right:'$$',display:true},
                    {left:'\\(',right:'\\)',display:false}],
        throwOnError:false, ignoredTags:['script','noscript','style','textarea','pre'],
        macros: macros || {}
      });
    }catch(e){ /* leave the text as written */ }
  }
  root.querySelectorAll('.points li, section.blk p, .qa .a')
      .forEach(emphasise);
}

function renderEquation(root, tex, macros){
  const el = root.querySelector('.eq');
  if(!el || !window.katex || !tex) return;
  try{ katex.render(tex.replace(/^\$+|\$+$/g,'').trim(), el,
        {displayMode:true, throwOnError:false, macros: macros||{}}); }
  catch(e){ el.textContent = tex; }
}

async function fillDetail(num, root){
  const p = PAPERS.find(x=>x.num===num);
  root.innerHTML = `
    <div class="meta" style="margin-top:8px">
      ${p.abs_url ? `<a href="${esc(p.abs_url)}" target="_blank" rel="noopener">arXiv:${esc(p.arxiv_id)}</a>`:''}
    </div>
    <div class="absbox"></div>
    <section class="blk" style="margin-top:14px">
      <h4>Your note <span style="text-transform:none;letter-spacing:0;font-weight:400">— saved into the spreadsheet</span></h4>
      <textarea class="notebox" placeholder="What you thought of it…">${esc(p.notes||'')}</textarea>
      <p class="notestate"></p>
    </section>
    <div class="glance"></div><div class="deepwrap"></div><div class="qa"></div>`;

  const note = root.querySelector('.notebox'), state = root.querySelector('.notestate');
  let saved = p.notes || '';
  const saveNote = async () => {
    const text = note.value.trim();
    if(text === saved) return;
    // claimed before the request goes out, not after it comes back: closing the
    // card flushes the note and then blur arrives behind it, and the spreadsheet
    // should be written once
    saved = text;
    state.textContent = 'saving…';
    const res = await fetch(`/api/papers/${num}/note`, {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({text})});
    if(!res.ok){ saved = null; state.textContent = 'could not write to the spreadsheet'; return; }
    p.notes = text;
    render();     // the card's border says whether it has a note; no-op while open
    state.textContent = 'written to the spreadsheet';
    setTimeout(() => { if(state.textContent === 'written to the spreadsheet') state.textContent = ''; }, 2200);
  };
  note._save = saveNote;                     // so closing the card can flush it
  note.addEventListener('blur', saveNote);
  note.addEventListener('keydown', e => {
    if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); note.blur(); }
  });

  const data = await (await fetch(`/api/papers/${num}`)).json();
  // Open while there is nothing else to read, shut once there is: a glance takes
  // about a minute, and the abstract is what that minute is otherwise spent not
  // reading. Afterwards it is the thing the digest was written to save you.
  if(data.abstract)
    root.querySelector('.absbox').innerHTML =
      `<details class="abs"${data.glance ? '' : ' open'}>
         <summary>Abstract</summary><p>${esc(data.abstract)}</p></details>`;
  // whatever is saved goes up first, so a deep read in flight has a glance above it
  if(data.glance) showGlance(num, root, sections(data.glance.raw||''), data);
  // a generation from an earlier open of this card is adopted, never restarted:
  // it is already being paid for, and the server saves it either way
  if(JOBS.has(num)) jobShow(num, root);
  else if(!data.glance) runGlance(num, root, data);
  renderQA(num, root, data.chat||[]);
}

function showGlance(num, root, s, data){
  root.querySelector('.glance').innerHTML = glanceHtml(s);
  renderMath(root.querySelector('.glance'), data.macros);

  // the card may have been closed while this was generating, which detaches root
  const bar = root.closest('.card')?.querySelector('.controls');
  if(!bar) return;
  bar.innerHTML = `<div class="rowbtns">
    <button class="btn ${data.deep ? '' : 'primary'}" data-go="deep"
      title="Mechanism, the central equation, and the figures">${
      data.deep ? 'Deep read again' : 'Go deeper'}</button>
    <button class="btn" data-go="again"
      title="Read the paper again from scratch">Rewrite summary</button>
  </div>`;
  bar.querySelector('[data-go="deep"]').onclick = () => runDeep(num, root);
  bar.querySelector('[data-go="again"]').onclick = () => runGlance(num, root, data);

  const wrap = root.querySelector('.deepwrap');
  if(data.deep){
    const d = sections(data.deep.raw||''), used = new Set();
    wrap.innerHTML = deepHtml(d, data, used);
    renderEquation(wrap, d.equation, data.macros);
    renderMath(wrap, data.macros);
    showFigures(wrap, data, used);
  }else{
    wrap.innerHTML = '';
  }
}

function showFigures(wrap, data, used){
  const rest = (data.figures || []).filter(f => !used || !used.has(f.file));
  if(!rest.length) return;
  wrap.insertAdjacentHTML('beforeend',
    `<section class="blk"><h4>${used && used.size ? 'Other figures' : 'Figures'}</h4>
       <div class="figs">${rest.map(figureMarkup).join('')}</div></section>`);
}

function runGlance(num, root, data){
  const j = jobStart(num, 'glance', root, raw => glanceHtml(sections(raw)));
  stream(`/api/papers/${num}/glance`, null, {
    phase: m => jobPhase(j, m),
    think: t => { if(j.pr) j.pr.think(t); },
    text: t => jobText(j, t),
    done: msg => {
      const box = j.box, here = j.root;     // both null if the card was closed
      jobEnd(num);
      if(msg.error){ if(box) box.innerHTML = `<p class="err">${esc(msg.error)}</p>`; return; }
      const p = PAPERS.find(x=>x.num===num), s = sections(j.raw);
      if(p){ p.claim = s.claim || ''; p.score = +s.score || null; p.has_glance = true; }
      if(here) showGlance(num, here, s, data);
    }});
}

function runDeep(num, root){
  const j = jobStart(num, 'deep', root, raw => deepHtml(sections(raw)));
  stream(`/api/papers/${num}/deep`, null, {
    phase: m => jobPhase(j, m),
    think: t => { if(j.pr) j.pr.think(t); },
    text: t => jobText(j, t),
    done: async msg => {
      const wrap = j.box, raw = j.raw;      // null if the card was closed
      jobEnd(num);
      const p = PAPERS.find(x=>x.num===num);
      if(msg.error){ if(wrap) wrap.innerHTML = `<p class="err">${esc(msg.error)}</p>`; return; }
      if(p) p.has_deep = true;
      if(!wrap) return;
      const data = await (await fetch(`/api/papers/${num}`)).json();
      const d = sections(raw), used = new Set();
      wrap.innerHTML = deepHtml(d, data, used);
      renderEquation(wrap, d.equation, data.macros);
      renderMath(wrap, data.macros);
      showFigures(wrap, data, used);
    }});
}

function renderQA(num, root, chat){
  const qa = root.querySelector('.qa');
  qa.innerHTML = chat.length
    ? `<h4>Your questions</h4><div class="turns">${chat.map(t =>
        `<div class="turn"><p class="q">${esc(t.q)}</p><p class="a">${esc(t.a)}</p></div>`).join('')}</div>`
    : '<div class="turns"></div>';

  const bar = root.closest('.card')?.querySelector('.askbar');
  if(!bar) return;
  bar.innerHTML = `<div class="askrow">
       <input class="askbox" placeholder="Ask this paper — e.g. does it assume periodic boundaries?">
       <button class="btn primary">Ask</button>
     </div>`;
  const box = bar.querySelector('.askbox');
  const send = () => {
    const q = box.value.trim(); if(!q) return;
    box.value = '';
    if(!qa.querySelector('h4'))
      qa.insertAdjacentHTML('afterbegin', '<h4>Your questions</h4>');
    const div = document.createElement('div');
    div.className = 'turn';
    div.innerHTML = `<p class="q">${esc(q)}</p><p class="a spin"></p>`;
    qa.querySelector('.turns').appendChild(div);
    const a = div.querySelector('.a');
    const stick = () => { root.scrollTop = root.scrollHeight; };   // follow the answer
    stick();
    let raw = '';
    stream(`/api/papers/${num}/ask`, {question:q}, {
      think: t => { if(!raw) a.textContent = ('thinking: ' + t).slice(0,160); },
      text: t => { raw += t; a.classList.remove('spin'); a.textContent = raw; },
      done: msg => { if(msg.error) a.innerHTML = `<span class="err">${esc(msg.error)}</span>`; }});
  };
  bar.querySelector('.btn').onclick = send;
  box.addEventListener('keydown', e => { if(e.key==='Enter') send(); });
}

/* ---------- wiring ---------- */
async function toggleStar(num, btn){
  const p = PAPERS.find(x => x.num === num);
  const want = !p.starred;
  const res = await fetch(`/api/papers/${num}/star`, {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({starred: want})});
  if(!res.ok){ btn.title = 'could not write to the spreadsheet'; return; }
  p.starred = want;
  btn.setAttribute('aria-pressed', String(want));
  btn.textContent = want ? '★' : '☆';
  buildChips();
}

$('#grid').addEventListener('click', e => {
  const s = e.target.closest('[data-star]');
  if(s){ e.stopPropagation(); toggleStar(+s.dataset.star, s); return; }
  if(e.target.closest('.card.growing')) return;      // clicks inside an open card
  const card = e.target.closest('.card');
  if(card) openCard(+card.dataset.num);
});
$('#scrim').onclick = () => collapse();
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ collapse(); return; }
  if(open === null || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;                      // not while a note or a question is being typed
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if(e.key === 'ArrowLeft'){ e.preventDefault(); step(-1); }
  if(e.key === 'ArrowRight'){ e.preventDefault(); step(1); }
});
addEventListener('resize', () => {
  const card = document.querySelector('.card.growing');
  if(!card) return;
  const t = targetRect();
  Object.assign(card.style, {top:t.top+'px', left:t.left+'px',
                             width:t.width+'px', height:t.height+'px'});
});
let searchTimer;
$('#q').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(render, 180);
});
$('#sort').value = sortBy;
$('#sort').onchange = e => {
  sortBy = e.target.value;
  try{ localStorage.setItem('litdigest.sort', sortBy); }catch(err){}
  render();
};
/* Without KaTeX every equation shows as its own source, which reads as a broken
   digest rather than what it is. The usual cause is a server started before the
   app gained its /vendor mount, still serving this page off disk. */
addEventListener('load', () => {
  if(window.renderMathInElement) return;
  const bar = document.createElement('div');
  bar.className = 'warnbar';
  bar.textContent = 'Equations are showing as LaTeX source because KaTeX did not load.'
    + ' If the app was updated while it was running, restart the server.';
  $('.bar').appendChild(bar);
});

$('#reload').onclick = () => boot();
$('#quit').onclick = async () => {
  if(!confirm('Stop LitDigest? The page will stop working until you open the app again.')) return;
  try{ await fetch('/api/quit', {method:'POST'}); }catch(e){}
  document.body.innerHTML =
    '<div style="max-width:520px;margin:22vh auto;text-align:center;color:var(--muted)">'
    + '<h1 style="color:var(--ink);font-size:22px;margin:0 0 8px">LitDigest stopped</h1>'
    + '<p>Open LitDigest.app again to pick up where you left off.</p></div>';
};
async function boot(){
  const d = await (await fetch('/api/papers')).json();
  PAPERS = d.papers;
  $('#src').textContent = d.model + ' · ' + d.source.split('/').pop()
    + (d.added ? ` · ${d.added} new` : '');
  buildChips(); render();
}
boot();
</script>
